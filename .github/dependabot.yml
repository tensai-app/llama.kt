version: 2
updates:
  # Actions are pinned by commit SHA; this keeps the pins and their version
  # comments moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  # Root build covers :llama-kt and :example. llama.cpp is bumped by hand
  # (patch rebases), so no gitsubmodule entry.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
