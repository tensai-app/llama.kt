name: CI

# Kotlin only: none of these tasks depends on externalNativeBuild, so no NDK,
# no CMake, no shaders and no nested submodule. The native build is native.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM unit tests
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle (dependencies) and the build cache across runs.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The example app is compiled too: it is the only consumer of the public
      # API in this repo, so an API break shows up here.
      - name: Unit tests
        run: ./gradlew --no-daemon :llama-kt:testDebugUnitTest :example:compileDebugKotlin

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: llama-kt/build/reports/tests/testDebugUnitTest/
          retention-days: 14
